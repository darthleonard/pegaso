<ng-container>
  <ion-card *ngIf="loading">
    <ion-card-content class="loader">
      <ion-spinner name="lines"></ion-spinner>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="!loading && error" color="danger">
    <ion-card-header>
      <ion-item lines="none">
        <ion-icon
          slot="start"
          name="alert-circle-outline"
          color="danger"
        ></ion-icon>
        <ion-card-title>Error</ion-card-title>
      </ion-item>
    </ion-card-header>
    <ion-card-content>
      {{ error }}
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="!loading && !error">
    <ion-card-header (click)="onClick()">
      <ion-item lines="none">
        <ion-icon slot="start" name="home-outline" color="primary"></ion-icon>
        <ion-card-title>House bills (current month)</ion-card-title>
      </ion-item>
    </ion-card-header>
    <ion-card-content *ngIf="bill">
      <ion-item lines="none">
        <ion-grid>
          <ion-row>
            <ion-col size="6" (click)="onClick()">
              <ion-label>{{ bill.month | date : "MMMM y" }}</ion-label>
            </ion-col>
            <ion-col>
              <app-bill-icon
                name="home-outline"
                [group]="bill.month"
                [value]="bill.house"
              />
            </ion-col>
            <ion-col>
              <app-bill-icon
                name="tv-outline"
                [group]="bill.month"
                [value]="bill.cable"
              />
            </ion-col>
            <ion-col>
              <app-bill-icon
                name="water-outline"
                [group]="bill.month"
                [value]="bill.water"
              />
            </ion-col>
            <ion-col>
              <app-bill-icon
                name="bulb-outline"
                [group]="bill.month"
                [value]="bill.electricity"
              />
            </ion-col>
            <ion-col>
              <app-bill-icon
                name="flame-outline"
                [group]="bill.month"
                [value]="bill.gas"
              />
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
    </ion-card-content>

    <!-- Empty KPI-style content when no bill is present -->
    <ion-card-content *ngIf="!bill" class="kpi">
      <div class="kpi-sub">No bills records found</div>
    </ion-card-content>
  </ion-card>
</ng-container>

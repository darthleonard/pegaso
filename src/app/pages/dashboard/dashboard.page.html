<app-header title="Dashboard"></app-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" sizeMd="4">
        <app-current-bill></app-current-bill>
      </ion-col>

      <ion-col size="12" sizeMd="4">
        <ion-card>
          <ion-card-header>
            <ion-item lines="none">
              <ion-icon
                slot="start"
                name="water-outline"
                color="secondary"
              ></ion-icon>
              <ion-card-title>Recent fuel</ion-card-title>
            </ion-item>
          </ion-card-header>
          <ion-card-content>
            <div *ngIf="recentFuel; else noFuel" class="kpi">
              <div class="kpi-value">
                {{ recentFuel.fill_date | date:'mediumDate' }}
              </div>
              <div class="kpi-sub">{{ recentFuel.total | currency }}</div>
            </div>
            <ng-template #noFuel>
              <div class="kpi-sub">No fuel records found</div>
            </ng-template>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeMd="4">
        <ion-card>
          <ion-card-header>
            <ion-item lines="none">
              <ion-icon
                slot="start"
                name="pricetags-outline"
                color="tertiary"
              ></ion-icon>
              <ion-card-title>Top products</ion-card-title>
            </ion-item>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="none">
              <ion-item *ngFor="let p of topProducts">
                <ion-label>
                  <h3>{{ p.name }}</h3>
                  <p class="small">{{ p.count }} times</p>
                </ion-label>
              </ion-item>
              <ion-item *ngIf="!topProducts || topProducts.length===0">
                <ion-label>No product data</ion-label>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
